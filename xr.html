<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TEO-XR Web - Command Center</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <script>
        // ========================================================
        // KOMPONEN BARU: PEMBUAT PANEL ROUNDED, GRADIENT & GLOW
        // ========================================================
        AFRAME.registerComponent('sci-fi-panel', {
            schema: {
                width: {type: 'number', default: 5}, height: {type: 'number', default: 5},
                color: {type: 'string', default: '#0a1128'}, borderColor: {type: 'string', default: '#00e5ff'},
                diagonal: {type: 'boolean', default: false} 
            },
            init: function() {
                let canvas = document.createElement('canvas');
                let res = 256; // Resolusi tajam
                canvas.width = this.data.width * res; canvas.height = this.data.height * res;
                let ctx = canvas.getContext('2d');
                let w = canvas.width; let h = canvas.height;
                
                // Ujung dibuat membulat (Rounded)
                let r = 80; 

                ctx.clearRect(0,0,w,h);

                // 1. Bentuk Dasar Panel
                ctx.beginPath();
                ctx.moveTo(r, 0); ctx.lineTo(w-r, 0); ctx.quadraticCurveTo(w, 0, w, r);
                ctx.lineTo(w, h-r); ctx.quadraticCurveTo(w, h, w-r, h);
                ctx.lineTo(r, h); ctx.quadraticCurveTo(0, h, 0, h-r);
                ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
                ctx.closePath();

                // 2. Efek Semu Gradien di Dalam Panel
                let grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, 'rgba(0, 229, 255, 0.15)'); // Cyan transparan di atas
                grad.addColorStop(1, 'rgba(5, 10, 25, 0.8)');    // Biru gelap di bawah
                ctx.fillStyle = grad;
                ctx.fill();

                // 3. Garis Border Keliling (Tipis)
                ctx.lineWidth = 6;
                ctx.strokeStyle = this.data.borderColor;
                ctx.stroke();

                // 4. GARIS ATAS TERANG (Glow Effect)
                ctx.beginPath();
                ctx.moveTo(r, 0); ctx.lineTo(w-r, 0);
                ctx.lineWidth = 12;
                ctx.strokeStyle = '#ffffff'; // Putih Terang
                ctx.shadowColor = '#00e5ff'; // Glow Cyan
                ctx.shadowBlur = 30;
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset shadow

                // 5. Aksesoris Garis Miring Diagonal
                if(this.data.diagonal) {
                    ctx.beginPath();
                    ctx.moveTo(0, h * 0.65); ctx.lineTo(w, h * 0.25);
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, h * 0.68); ctx.lineTo(w, h * 0.28);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(255, 42, 109, 0.4)';
                    ctx.stroke();
                }

                let texture = new THREE.CanvasTexture(canvas);
                let material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });

                let mesh = this.el.getObject3D('mesh');
                if(mesh) mesh.material = material;
                else this.el.addEventListener('model-loaded', () => this.el.getObject3D('mesh').material = material);
            }
        });

        // ========================================================
        // KOMPONEN TOMBOL
        // ========================================================
        AFRAME.registerComponent('mqtt-button', {
            schema: { topic: {type: 'string'}, payload: {type: 'string'}, isTest: {type: 'boolean', default: false} },
            init: function () {
                var data = this.data; var el = this.el;
                this.originalColor = el.getAttribute('material').color;
                
                el.addEventListener('mouseenter', () => {
                    el.setAttribute('scale', '1.05 1.05 1.05');
                    el.setAttribute('material', 'color', '#ffffff');
                });
                el.addEventListener('mouseleave', () => {
                    el.setAttribute('scale', '1 1 1');
                    el.setAttribute('material', 'color', this.originalColor);
                });
                el.addEventListener('click', function () {
                    el.setAttribute('scale', '0.9 0.9 0.9');
                    setTimeout(() => el.setAttribute('scale', '1.05 1.05 1.05'), 150);
                    
                    if (data.isTest) {
                        if (window.startStepTest) window.startStepTest();
                    } else if (window.sendMqttCommand) {
                        window.sendMqttCommand(data.topic, data.payload);
                    }
                });
            }
        });

        // ========================================================
        // KOMPONEN SLIDER
        // ========================================================
        AFRAME.registerComponent('xr-slider', {
            schema: {
                topic: {type: 'string'}, min: {type: 'number', default: 0}, max: {type: 'number', default: 100},
                width: {type: 'number', default: 2.2}, value: {type: 'number', default: 0},
                label: {type: 'string', default: 'VAL'}, isFloat: {type: 'boolean', default: false} 
            },
            init: function () {
                this.track = document.createElement('a-plane');
                this.track.setAttribute('width', this.data.width); this.track.setAttribute('height', '0.12');
                this.track.setAttribute('color', '#0a1128'); this.track.setAttribute('opacity', '0.8');
                
                this.trackBorder = document.createElement('a-entity');
                this.trackBorder.setAttribute('geometry', `primitive: plane; width: ${this.data.width + 0.04}; height: 0.16`);
                this.trackBorder.setAttribute('material', 'color: #00e5ff; opacity: 0.3');
                this.trackBorder.setAttribute('position', '0 0 -0.01');
                this.track.appendChild(this.trackBorder);
                this.track.classList.add('clickable');

                this.fill = document.createElement('a-plane');
                this.fill.setAttribute('height', '0.12'); this.fill.setAttribute('color', '#00e5ff');

                this.text = document.createElement('a-text');
                this.text.setAttribute('position', '0 0.25 0');
                this.text.setAttribute('align', 'center');
                this.text.setAttribute('color', '#ffffff');
                this.text.setAttribute('width', '4'); 

                this.el.appendChild(this.track); this.el.appendChild(this.fill); this.el.appendChild(this.text);
                
                let self = this;
                this.track.addEventListener('click', function (evt) {
                    let localPoint = self.el.object3D.worldToLocal(evt.detail.intersection.point.clone());
                    let percent = (localPoint.x + self.data.width / 2) / self.data.width;
                    if (percent < 0) percent = 0; if (percent > 1) percent = 1;
                    let val = percent * (self.data.max - self.data.min) + self.data.min;
                    if (!self.data.isFloat) val = Math.round(val);
                    self.setValue(val);
                    if (window.sendMqttCommand) window.sendMqttCommand(self.data.topic, self.data.isFloat ? val.toFixed(2) : val);
                });
                this.setValue(this.data.value);
            },
            setValue: function(val) {
                let percent = (val - this.data.min) / (this.data.max - this.data.min);
                let fillWidth = percent * this.data.width; let fillX = (-this.data.width / 2) + (fillWidth / 2);
                this.fill.setAttribute('width', fillWidth); this.fill.setAttribute('position', fillX + ' 0 0.01');
                
                let displayVal = this.data.isFloat ? val.toFixed(2) : Math.round(val);
                this.text.setAttribute('value', `${this.data.label}: ${displayVal}`);
                
                if (this.data.label === "Kp") window.currentKp = val;
                if (this.data.label === "Ki") window.currentKi = val;
                if (this.data.label === "Kd") window.currentKd = val;
                if (this.data.label === "TARGET RPM") window.currentSetpoint = val;
                if (this.data.label === "RAW PWM") window.currentPwm = val;
            }
        });

        // ========================================================
        // KOMPONEN GRAFIK (XR CHART)
        // ========================================================
        AFRAME.registerComponent('xr-chart', {
            schema: { width: {type: 'number', default: 1024}, height: {type: 'number', default: 512} },
            init: function() {
                this.canvas = document.createElement('canvas');
                this.canvas.width = this.data.width; this.canvas.height = this.data.height;
                this.ctx = this.canvas.getContext('2d');
                
                this.dataPoints = []; this.targetPoints = []; this.maxPoints = 80;
                
                this.texture = new THREE.CanvasTexture(this.canvas);
                this.material = new THREE.MeshBasicMaterial({ map: this.texture, transparent: true });
                let mesh = this.el.getObject3D('mesh');
                if (mesh) { mesh.material = this.material; } 
                else { this.el.addEventListener('model-loaded', () => { this.el.getObject3D('mesh').material = this.material; }); }
                this.drawChart();
            },
            updateData: function(realVal, targetVal) {
                this.dataPoints.push(realVal); this.targetPoints.push(targetVal);
                if(this.dataPoints.length > this.maxPoints) { this.dataPoints.shift(); this.targetPoints.shift(); }
                this.drawChart();
            },
            drawChart: function() {
                let ctx = this.ctx; let w = this.canvas.width; let h = this.canvas.height;
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(5, 9, 20, 0.6)'; ctx.fillRect(0, 0, w, h);
                
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)'; ctx.lineWidth = 1;
                for(let i=1; i<5; i++) { ctx.beginPath(); ctx.moveTo(0, h * (i/5)); ctx.lineTo(w, h * (i/5)); ctx.stroke(); }

                ctx.strokeStyle = 'rgba(0, 229, 255, 0.5)'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, w, h);
                
                if(this.dataPoints.length > 1) {
                    let step = w / (this.maxPoints - 1);
                    
                    ctx.beginPath(); ctx.strokeStyle = 'rgba(255, 42, 109, 0.8)'; ctx.lineWidth = 4; ctx.setLineDash([15, 15]); 
                    for(let i = 0; i < this.targetPoints.length; i++) {
                        let x = i * step; let y = h - ((this.targetPoints[i] / 200) * h); 
                        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke(); ctx.setLineDash([]);

                    ctx.beginPath(); ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 8;
                    for(let i = 0; i < this.dataPoints.length; i++) {
                        let x = i * step; let y = h - ((this.dataPoints[i] / 200) * h); 
                        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                if(this.texture) this.texture.needsUpdate = true;
            }
        });

        // ========================================================
        // KOMPONEN SMART ZOOM
        // ========================================================
        AFRAME.registerComponent('smart-zoom', {
            init: function () {
                let camEl = this.el; let currentFov = 80;
                window.addEventListener('wheel', function (e) {
                    currentFov += Math.sign(e.deltaY) * 5;
                    currentFov = Math.max(30, Math.min(110, currentFov));
                    camEl.setAttribute('camera', 'fov', currentFov);
                });
                let initialDist = null;
                window.addEventListener('touchstart', function(e) {
                    if (e.touches.length === 2) initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                });
                window.addEventListener('touchmove', function(e) {
                    if (e.touches.length === 2 && initialDist !== null) {
                        let currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                        currentFov += (initialDist - currentDist) * 0.15;
                        currentFov = Math.max(30, Math.min(110, currentFov));
                        camEl.setAttribute('camera', 'fov', currentFov); initialDist = currentDist;
                    }
                });
                window.addEventListener('touchend', function(e) { if (e.touches.length < 2) initialDist = null; });
            }
        });
    </script>
</head>
<body>

    <a-scene background="color: #010308" cursor="rayOrigin: mouse">
        <!-- Lantai Grid & Cahaya -->
        <a-grid width="100" height="100" color="#00e5ff" rotation="-90 0 0" opacity="0.1"></a-grid>
        <a-light type="ambient" color="#333"></a-light>
        <a-light type="point" intensity="2.0" color="#00e5ff" position="0 6 2"></a-light>
        <a-light type="point" intensity="1.0" color="#ff2a6d" position="0 2 -8"></a-light>

        <!-- ORNAMEN SCI-FI: Cincin Reaktor -->
        <a-entity position="0 2.5 -7" 
                  geometry="primitive: torus; radius: 4.5; radiusTubular: 0.02; segmentsTubular: 64" 
                  material="color: #00e5ff; opacity: 0.2; transparent: true; wireframe: true"
                  animation="property: rotation; to: 0 0 360; loop: true; dur: 20000; easing: linear">
        </a-entity>

        <!-- ============================================== -->
        <!-- PANEL TENGAH (UTAMA) - SKALA DITURUNKAN SEDIKIT -->
        <!-- ============================================== -->
        <a-entity position="0 2.5 -6" scale="1.4 1.4 1.4"
                  animation="property: position; to: 0 2.55 -6; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine">
            
            <a-entity geometry="primitive: plane; width: 6.4; height: 5.4" 
                      sci-fi-panel="width: 6.4; height: 5.4; diagonal: false" 
                      position="0 -0.5 -0.05"></a-entity>

            <!-- LOGO AKTIF DIPANGGIL LANGSUNG TUK MENGHINDARI KOTAK PUTIH LOKAL -->
            <a-image src="logo.png" position="-2.4 1.8 0.1" width="1.1" height="1.1"
                     animation="property: scale; dir: alternate; dur: 2000; to: 1.05 1.05 1; loop: true"></a-image>

            <a-text value="TEO-XR TELECONTROL" color="#ffffff" align="left" width="6" position="-1.5 2.0 0.01"></a-text>
            <a-text value="XR COMMAND CENTER" color="#00e5ff" align="left" width="4" position="-1.5 1.6 0.01"></a-text>
            
            <a-entity position="2.0 1.8 0.01">
                <a-text value="SYSTEM STATUS" color="#a0aec0" align="center" width="3" position="0 0.2 0"></a-text>
                <a-text id="xr-status" value="OFFLINE" color="#ff2a6d" align="center" width="5" position="0 -0.1 0"></a-text>
            </a-entity>

            <a-entity position="0 0.4 0.01">
                <a-plane width="1.8" height="1.0" color="#185b9d" opacity="0.6" position="-1.5 0 0">
                    <a-entity geometry="primitive: plane; width: 1.9; height: 1.1" material="color: #00e5ff; opacity: 0.3; wireframe: true" position="0 0 -0.01"></a-entity>
                    <a-text value="LIVE RPM" color="#00e5ff" align="center" width="3" position="0 0.25 0.01"></a-text>
                    <a-text id="xr-rpm" value="0.0" color="#ffffff" align="center" width="8" position="0 -0.15 0.01"></a-text>
                </a-plane>

                <a-plane width="1.8" height="1.0" color="#ff2a6d" opacity="0.2" position="1.5 0 0">
                    <a-entity geometry="primitive: plane; width: 1.9; height: 1.1" material="color: #ff2a6d; opacity: 0.3; wireframe: true" position="0 0 -0.01"></a-entity>
                    <a-text value="SYS ERROR" color="#ff2a6d" align="center" width="3" position="0 0.25 0.01"></a-text>
                    <a-text id="xr-error" value="0.0" color="#ffffff" align="center" width="8" position="0 -0.15 0.01"></a-text>
                </a-plane>
            </a-entity>

            <a-entity position="0 -1.4 0.01">
                <a-entity xr-slider="topic: robot1/setpoint; label: TARGET RPM; min: 0; max: 200; value: 120; width: 5.2"></a-entity>
            </a-entity>
        </a-entity>

        <!-- KAMERA -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls wasd-controls smart-zoom>
                <a-cursor color="#ff2a6d" raycaster="objects: .clickable" 
                          animation__click="property: scale; startEvents: click; easing: easeOutQuad; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
                </a-cursor>
            </a-camera>
        </a-entity>

        <!-- ============================================== -->
        <!-- PANEL KIRI (KONTROL) - JARAK DIATUR PAS! (X = -8.5) -->
        <!-- ============================================== -->
        <a-entity position="-8.5 2.5 -5.2" rotation="0 35 0" scale="1.3 1.3 1.3"
                  animation="property: position; to: -8.5 2.55 -5.2; dir: alternate; dur: 3200; loop: true; easing: easeInOutSine">
            
            <a-entity geometry="primitive: plane; width: 5.2; height: 5.8" 
                      sci-fi-panel="width: 5.2; height: 5.8; diagonal: true" 
                      position="0 -0.5 -0.05"></a-entity>
            
            <a-entity position="-1.5 0 0.01">
                <a-text value="KINEMATIC MODES" color="#00e5ff" align="center" width="3.5" position="0 1.8 0"></a-text>
                
                <a-entity geometry="primitive: box; depth: 0.05; height: 0.4; width: 1.6" material="color: #ff2a6d" mqtt-button="topic: robot1/mode; payload: STOP" position="0 1.2 0" class="clickable">
                    <a-text value="STOP" align="center" width="4" position="0 0 0.03" color="#ffffff"></a-text>
                </a-entity>
                <a-entity geometry="primitive: box; depth: 0.05; height: 0.4; width: 1.6" material="color: #0a1128" mqtt-button="topic: robot1/mode; payload: PID" position="0 0.6 0" class="clickable">
                    <a-text value="PID" align="center" width="4" position="0 0 0.03" color="#00e5ff"></a-text>
                </a-entity>
                <a-entity geometry="primitive: box; depth: 0.05; height: 0.4; width: 1.6" material="color: #0a1128" mqtt-button="topic: robot1/mode; payload: MANUAL" position="0 0.0 0" class="clickable">
                    <a-text value="MANUAL" align="center" width="4" position="0 0 0.03" color="#00e5ff"></a-text>
                </a-entity>
                
                <a-text value="DRIVE VECTOR" color="#00e5ff" align="center" width="3.5" position="0 -0.8 0"></a-text>
                <a-entity geometry="primitive: box; depth: 0.05; height: 0.4; width: 1.6" material="color: #185b9d" mqtt-button="topic: robot1/direction; payload: FORWARD" position="0 -1.4 0" class="clickable">
                    <a-text value="FORWARD" align="center" width="4" position="0 0 0.03" color="#ffffff"></a-text>
                </a-entity>
                <a-entity geometry="primitive: box; depth: 0.05; height: 0.4; width: 1.6" material="color: #185b9d" mqtt-button="topic: robot1/direction; payload: BACKWARD" position="0 -2.0 0" class="clickable">
                    <a-text value="BACKWARD" align="center" width="4" position="0 0 0.03" color="#ffffff"></a-text>
                </a-entity>
            </a-entity>

            <a-entity position="1.2 0 0.01">
                <a-text value="SYSTEM TUNING" color="#00e5ff" align="center" width="3.5" position="0 1.8 0"></a-text>
                
                <a-entity position="0 1.2 0" xr-slider="topic: robot1/pid/kp; label: Kp; min: 0; max: 50; value: 1.5; width: 2.2; isFloat: true"></a-entity>
                <a-entity position="0 0.5 0" xr-slider="topic: robot1/pid/ki; label: Ki; min: 0; max: 10; value: 0.05; width: 2.2; isFloat: true"></a-entity>
                <a-entity position="0 -0.2 0" xr-slider="topic: robot1/pid/kd; label: Kd; min: 0; max: 10; value: 0.1; width: 2.2; isFloat: true"></a-entity>
                <a-entity position="0 -0.9 0" xr-slider="topic: robot1/manual_pwm; label: PWM; min: 0; max: 255; value: 0; width: 2.2"></a-entity>

                <a-entity geometry="primitive: box; depth: 0.05; height: 0.5; width: 2.4" material="color: #0a1128" mqtt-button="topic: robot1/config; payload: TRIGGER" position="0 -1.8 0" class="clickable">
                    <a-text value="TRANSMIT DATA" align="center" width="3.5" position="0 0 0.03" color="#00e5ff"></a-text>
                </a-entity>
                <a-entity geometry="primitive: box; depth: 0.05; height: 0.5; width: 2.4" material="color: #4ba3d3" mqtt-button="isTest: true" position="0 -2.5 0" class="clickable">
                    <a-text value="INIT STEP TEST" align="center" width="3.5" position="0 0 0.03" color="#ffffff"></a-text>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- ============================================== -->
        <!-- PANEL KANAN (GRAFIK) - JARAK DIATUR PAS! (X = 8.5) -->
        <!-- ============================================== -->
        <a-entity position="8.5 2.5 -5.2" rotation="0 -35 0" scale="1.3 1.3 1.3"
                  animation="property: position; to: 8.5 2.55 -5.2; dir: alternate; dur: 3800; loop: true; easing: easeInOutSine">
            
            <a-entity geometry="primitive: plane; width: 5.2; height: 5.8" 
                      sci-fi-panel="width: 5.2; height: 5.8; diagonal: true" 
                      position="0 -0.5 -0.05"></a-entity>
            
            <a-text value="RESPONSE MATRIX" color="#00e5ff" align="center" width="5" position="0 1.8 0.01"></a-text>
            
            <a-entity id="live-chart" geometry="primitive: plane; width: 4.6; height: 2.6" xr-chart position="0 0.2 0.01"></a-entity>
            
            <a-entity position="0 -1.8 0.01">
                <a-entity geometry="primitive: plane; width: 1.4; height: 0.8" material="color: #0a1128; opacity: 0.8" position="-1.5 0 -0.01"></a-entity>
                <a-text value="RISE TIME" color="#888888" align="center" width="2.5" position="-1.5 0.2 0"></a-text>
                <a-text id="xr-rise" value="0.0s" color="#00e5ff" align="center" width="4" position="-1.5 -0.15 0"></a-text>

                <a-entity geometry="primitive: plane; width: 1.4; height: 0.8" material="color: #0a1128; opacity: 0.8" position="0 0 -0.01"></a-entity>
                <a-text value="OVERSHOOT" color="#888888" align="center" width="2.5" position="0 0.2 0"></a-text>
                <a-text id="xr-over" value="0.0%" color="#ff2a6d" align="center" width="4" position="0 -0.15 0"></a-text>

                <a-entity geometry="primitive: plane; width: 1.4; height: 0.8" material="color: #0a1128; opacity: 0.8" position="1.5 0 -0.01"></a-entity>
                <a-text value="SETTLING" color="#888888" align="center" width="2.5" position="1.5 0.2 0"></a-text>
                <a-text id="xr-settle" value="0.0s" color="#4ba3d3" align="center" width="4" position="1.5 -0.15 0"></a-text>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const mqttServer = "3ed3ff9607bb421593226daf3b27b6f4.s1.eu.hivemq.cloud";
        const mqttPort = 8884; 
        const mqttUser = "teoxr";
        const mqttPass = "TEOxr073";
        const clientId = "WebXR-Cockpit-" + Math.random().toString(16).substr(2, 8);
        
        const client = new Paho.MQTT.Client(mqttServer, mqttPort, clientId);
        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        window.currentKp = 1.5; window.currentKi = 0.05; window.currentKd = 0.1;
        window.currentSetpoint = 120; window.currentPwm = 0;

        window.isStepActive = false;
        window.stepStartTime = 0;
        window.maxRpm = 0;
        window.riseTimeFound = false;

        window.sendMqttCommand = function(topic, payload) {
            if (topic === "robot1/config") {
                sendSingle("robot1/pid/kp", window.currentKp);
                sendSingle("robot1/pid/ki", window.currentKi);
                sendSingle("robot1/pid/kd", window.currentKd);
                sendSingle("robot1/setpoint", window.currentSetpoint);
                sendSingle("robot1/manual_pwm", window.currentPwm);
            } else {
                sendSingle(topic, payload);
            }
        };

        function sendSingle(t, p) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(p.toString());
                message.destinationName = t;
                client.send(message);
            }
        }

        window.startStepTest = function() {
            window.isStepActive = true;
            window.stepStartTime = Date.now();
            window.maxRpm = 0;
            window.riseTimeFound = false;

            document.getElementById('xr-rise').setAttribute('value', '...');
            document.getElementById('xr-over').setAttribute('value', '0.0%');
            document.getElementById('xr-settle').setAttribute('value', '...');

            sendSingle("robot1/mode", "PID");
            sendSingle("robot1/config", "TRIGGER"); 
        };

        function connectMQTT() {
            client.connect({ userName: mqttUser, password: mqttPass, useSSL: true, onSuccess: onConnect, onFailure: (err) => { setTimeout(connectMQTT, 5000); } });
        }

        function onConnect() {
            document.getElementById('xr-status').setAttribute('value', 'ONLINE');
            document.getElementById('xr-status').setAttribute('color', '#00e5ff');
            client.subscribe("robot1/response");
        }

        function onConnectionLost() {
            document.getElementById('xr-status').setAttribute('value', 'OFFLINE');
            document.getElementById('xr-status').setAttribute('color', '#ff2a6d');
            setTimeout(connectMQTT, 3000);
        }

        function onMessageArrived(message) {
            if (message.destinationName === "robot1/response") {
                const data = JSON.parse(message.payloadString);
                
                document.getElementById('xr-rpm').setAttribute('value', data.speed.toFixed(1));
                document.getElementById('xr-error').setAttribute('value', data.error.toFixed(1));
                
                const chartEl = document.getElementById('live-chart');
                if(chartEl && chartEl.components['xr-chart']) {
                    let target = (document.getElementById('xr-status').getAttribute('value') === 'ONLINE' && window.currentSetpoint > 0) ? window.currentSetpoint : 0;
                    chartEl.components['xr-chart'].updateData(data.speed, target); 
                }

                if (window.isStepActive) {
                    let timeElapsed = (Date.now() - window.stepStartTime) / 1000;
                    let target = window.currentSetpoint;

                    if (data.speed > window.maxRpm) {
                        window.maxRpm = data.speed;
                        if (window.maxRpm > target && target > 0) {
                            let os = ((window.maxRpm - target) / target) * 100;
                            document.getElementById('xr-over').setAttribute('value', os.toFixed(1) + '%');
                        }
                    }

                    if (!window.riseTimeFound && data.speed >= target * 0.95 && target > 0) {
                        document.getElementById('xr-rise').setAttribute('value', timeElapsed.toFixed(2) + 's');
                        window.riseTimeFound = true;
                    }

                    if (window.riseTimeFound) {
                        let err = Math.abs(target - data.speed);
                        if (err <= (target * 0.05)) { 
                            document.getElementById('xr-settle').setAttribute('value', timeElapsed.toFixed(2) + 's');
                        }
                    }
                }
            }
        }
        connectMQTT();
    </script>
</body>
</html>
