<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Imroatus AR Telecontrol</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; }
        /* Style untuk UI transparan ala Hologram di AR */
        #dom-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Biarkan klik tembus ke 3D kecuali di area panel */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .ar-panel {
            pointer-events: auto; /* Area ini bisa diklik di AR */
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #0ff;
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        .hud-text { font-family: monospace; color: #0ff; }
        .hud-red { color: #ff0055; }
        
        /* Hilangkan background VR saat mode AR aktif */
        .a-dom-overlay:not(.a-no-style) { background: transparent !important; }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. 3D SCENE & AR CAMERA -->
    <!-- ========================================== -->
    <!-- Mode DOM Overlay diaktifkan agar HTML bisa disentuh di dalam AR -->
    <a-scene webxr="optionalFeatures: dom-overlay; overlayElement: #dom-overlay;" 
             background="color: #111" 
             renderer="antialias: true; alpha: true">
        
        <!-- Panel 3D Hologram (MUNDUR 2.5 METER) -->
        <!-- Z = -2.5 artinya 2.5 meter di depan Anda. Y = 1.5 artinya setinggi dada/mata -->
        <a-entity id="hologram-panel" position="0 1.5 -2.5">
            <a-text value="XR TELEMETRY LINK ESTABLISHED" color="#0ff" align="center" position="0 0.5 0" scale="0.8 0.8 0.8"></a-text>
            <!-- Anda bisa menambahkan model 3D robot Anda di sini nanti -->
            <a-box color="#0ff" wireframe="true" scale="0.5 0.5 0.5" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"></a-box>
        </a-entity>

        <a-entity camera position="0 1.6 0" look-controls></a-entity>
    </a-scene>

    <!-- ========================================== -->
    <!-- 2. UI PANEL (DOM OVERLAY) -->
    <!-- ========================================== -->
    <div id="dom-overlay">
        <div class="ar-panel shadow-lg shadow-cyan-500/50">
            
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-bold text-cyan-400">AR KINEMATIC CONTROL</h2>
                <span id="status-text" class="text-red-500 font-bold animate-pulse">OFFLINE</span>
            </div>

            <!-- Bagian Grafik -->
            <div class="w-full h-40 bg-gray-900 rounded border border-cyan-800 mb-2 p-1">
                <canvas id="arChart"></canvas>
            </div>

            <!-- Bagian Metriks PID -->
            <div class="grid grid-cols-3 gap-2 mb-2 text-center text-xs hud-text">
                <div class="bg-gray-800 p-1 rounded border border-gray-600">
                    <span class="text-gray-400">RISE TIME</span><br>
                    <span id="riseTimeDisplay" class="text-lg text-cyan-300">0.0s</span>
                </div>
                <div class="bg-gray-800 p-1 rounded border border-gray-600">
                    <span class="text-gray-400">OVERSHOOT</span><br>
                    <span id="overshootDisplay" class="text-lg text-red-400">0.0%</span>
                </div>
                <div class="bg-gray-800 p-1 rounded border border-gray-600">
                    <span class="text-gray-400">SETTLING TIME</span><br>
                    <span id="settlingTimeDisplay" class="text-lg text-green-400">0.0s</span>
                </div>
            </div>

            <!-- Bagian Kontrol (Slider Batas Diperbesar) -->
            <div class="grid grid-cols-2 gap-4 text-sm mb-2">
                <div>
                    <label class="block text-gray-400 mb-1">MODE</label>
                    <select id="mode" class="w-full bg-gray-800 text-cyan-400 p-1 rounded border border-cyan-800">
                        <option value="STOP">STOP</option>
                        <option value="MANUAL">MANUAL</option>
                        <option value="PID">AUTO PID</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">TARGET RPM</label>
                    <input type="number" id="targetRPM" value="0" class="w-full bg-gray-800 text-white p-1 rounded border border-cyan-800">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 text-sm mb-4">
                <div>
                    <label class="block text-gray-400 text-xs">Kp (Max 50)</label>
                    <input type="number" id="kp" value="1.5" min="0" max="50" step="0.1" class="w-full bg-gray-800 text-white p-1 rounded border border-cyan-800">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs">Ki (Max 10)</label>
                    <input type="number" id="ki" value="0.05" min="0" max="10" step="0.01" class="w-full bg-gray-800 text-white p-1 rounded border border-cyan-800">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs">Kd (Max 10)</label>
                    <input type="number" id="kd" value="0.1" min="0" max="10" step="0.01" class="w-full bg-gray-800 text-white p-1 rounded border border-cyan-800">
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="flex gap-2">
                <button id="btnTransmit" class="flex-1 bg-cyan-700 hover:bg-cyan-600 text-white py-2 rounded font-bold transition-all">
                    TRANSMIT DATA
                </button>
                <button id="btnStep" class="flex-1 bg-red-700 hover:bg-red-600 text-white py-2 rounded font-bold transition-all">
                    INIT STEP RESPONSE
                </button>
            </div>
            <button id="btnEnterAR" class="w-full mt-2 border border-cyan-500 text-cyan-400 py-1 rounded text-sm hover:bg-cyan-900 transition-all">
                MASUK MODE AR / VR
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. LOGIKA JAVASCRIPT (MQTT, CHART, PID MATH) -->
    <!-- ========================================== -->
    <script>
        // 1. Inisialisasi Grafik (2 Garis: Real vs Target)
        const ctx = document.getElementById('arChart').getContext('2d');
        const arChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'REAL RPM',
                        borderColor: '#00ffff',
                        backgroundColor: 'rgba(0, 255, 255, 0.1)',
                        borderWidth: 2,
                        data: [],
                        tension: 0.2,
                        fill: true
                    },
                    {
                        label: 'TARGET RPM',
                        borderColor: '#ff0055',
                        borderWidth: 2,
                        borderDash: [5, 5], // Garis putus-putus
                        data: [],
                        tension: 0,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#333' } },
                    x: { display: false } // Sembunyikan label waktu agar rapi
                },
                plugins: { legend: { display: false } }
            }
        });

        // 2. Variabel MQTT & Step Response
        const mqtt_server = 'wss://3ed3ff9607bb421593226daf3b27b6f4.s1.eu.hivemq.cloud:8884/mqtt';
        const options = { username: 'teoxr', password: 'TEOxr073' };
        const client = mqtt.connect(mqtt_server, options);

        let isStepResponseActive = false;
        let stepTarget = 0;
        let stepStartTime = 0;
        let maxRPM = 0;
        let riseTimeFound = false;

        // 3. Event Listener MQTT
        client.on('connect', () => {
            console.log('AR Connected to HiveMQ!');
            document.getElementById('status-text').innerText = 'SYS_ONLINE';
            document.getElementById('status-text').className = 'text-cyan-400 font-bold';
            client.subscribe('robot1/response');
        });

        client.on('message', (topic, message) => {
            if (topic === 'robot1/response') {
                const data = JSON.parse(message.toString());
                updateChart(data.speed, data.setpoint);
                if (isStepResponseActive) calculateMetrics(data.speed, data.setpoint);
            }
        });

        // 4. Update Grafik
        let timeCounter = 0;
        function updateChart(realRPM, targetRPM) {
            timeCounter++;
            arChart.data.labels.push(timeCounter);
            arChart.data.datasets[0].data.push(realRPM);
            arChart.data.datasets[1].data.push(targetRPM);

            // Batasi data di layar agar tidak terlalu padat (misal 50 titik)
            if (arChart.data.labels.length > 50) {
                arChart.data.labels.shift();
                arChart.data.datasets[0].data.shift();
                arChart.data.datasets[1].data.shift();
            }
            arChart.update();
        }

        // 5. Kalkulasi Metriks PID
        function calculateMetrics(currentRPM, target) {
            const timeElapsed = (Date.now() - stepStartTime) / 1000; // dalam detik

            // Hitung Overshoot (Nilai Puncak)
            if (currentRPM > maxRPM) {
                maxRPM = currentRPM;
                if (maxRPM > target && target > 0) {
                    let overshootPercent = ((maxRPM - target) / target) * 100;
                    document.getElementById('overshootDisplay').innerText = overshootPercent.toFixed(1) + '%';
                }
            }

            // Hitung Rise Time (Waktu mencapai target pertama kali)
            if (!riseTimeFound && currentRPM >= target * 0.95 && target > 0) {
                document.getElementById('riseTimeDisplay').innerText = timeElapsed.toFixed(2) + 's';
                riseTimeFound = true;
            }

            // Hitung Settling Time (Stabil di batas +- 5% dari target)
            if (riseTimeFound) {
                let error = Math.abs(target - currentRPM);
                if (error <= (target * 0.05)) {
                    document.getElementById('settlingTimeDisplay').innerText = timeElapsed.toFixed(2) + 's';
                }
            }
        }

        // 6. Fungsi Tombol Transmit
        document.getElementById('btnTransmit').addEventListener('click', () => {
            const mode = document.getElementById('mode').value;
            client.publish('robot1/mode', mode);

            if (mode === 'PID') {
                client.publish('robot1/setpoint', document.getElementById('targetRPM').value);
                client.publish('robot1/pid/kp', document.getElementById('kp').value);
                client.publish('robot1/pid/ki', document.getElementById('ki').value);
                client.publish('robot1/pid/kd', document.getElementById('kd').value);
            }
        });

        // 7. Fungsi Tombol Step Response
        document.getElementById('btnStep').addEventListener('click', () => {
            // Reset Data Matriks
            isStepResponseActive = true;
            stepStartTime = Date.now();
            maxRPM = 0;
            riseTimeFound = false;
            stepTarget = parseFloat(document.getElementById('targetRPM').value);
            
            document.getElementById('riseTimeDisplay').innerText = '...';
            document.getElementById('overshootDisplay').innerText = '0.0%';
            document.getElementById('settlingTimeDisplay').innerText = '...';

            // Paksa masuk mode PID dan kirim parameter
            document.getElementById('mode').value = 'PID';
            client.publish('robot1/mode', 'PID');
            client.publish('robot1/pid/kp', document.getElementById('kp').value);
            client.publish('robot1/pid/ki', document.getElementById('ki').value);
            client.publish('robot1/pid/kd', document.getElementById('kd').value);
            client.publish('robot1/setpoint', stepTarget.toString());
        });

        // 8. Tombol Pintasan Masuk AR/VR
        document.getElementById('btnEnterAR').addEventListener('click', () => {
            const scene = document.querySelector('a-scene');
            if (scene.hasLoaded) {
                scene.enterVR(); // A-Frame otomatis menyajikan opsi AR jika didukung perangkat
            }
        });

    </script>
</body>
</html>
