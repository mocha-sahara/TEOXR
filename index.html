<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEOXR - Futuristic Telecontrol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            base: '#050914',     // Deep space background
                            panel: '#0A1128',    // Translucent dark panel
                            neon: '#00e5ff',     // Bright cyan from logo curve
                            gear: '#185b9d',     // Dark blue from logo gear
                            alert: '#ff2a6d'     // Futuristic red for errors
                        }
                    },
                    fontFamily: {
                        sans: ['Rajdhani', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['Fira Code', 'Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { 
            background-color: #050914; 
            background-image: radial-gradient(circle at 50% 0%, #0d1a3a 0%, transparent 50%), 
                              linear-gradient(0deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #e2e8f0;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050914; }
        ::-webkit-scrollbar-thumb { background: #00e5ff; border-radius: 3px; }

        .cyber-panel {
            background: rgba(10, 17, 40, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 0.75rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 229, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        
        .cyber-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, transparent);
            opacity: 0.5;
        }

        .input-cyber {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 0.375rem; padding: 0.5rem 0.75rem; color: #00e5ff; font-family: 'Fira Code', monospace;
            transition: all 0.3s ease; outline: none; box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        .input-cyber:focus { 
            border-color: #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.4), inset 0 0 5px rgba(0, 0, 0, 0.5); 
        }

        .btn-cyber {
            background: linear-gradient(45deg, #0A1128, #185b9d);
            border: 1px solid #00e5ff; color: #fff; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        
        .btn-cyber:hover {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6); text-shadow: 0 0 5px #fff;
        }

        .data-value {
            font-family: 'Fira Code', monospace; text-shadow: 0 0 10px currentColor;
        }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col font-sans">

    <header class="cyber-panel p-5 mb-6 flex flex-col md:flex-row justify-between items-center z-10">
        <div class="flex items-center w-full md:w-auto">
            <div class="bg-white p-1 rounded-lg mr-5 shadow-[0_0_15px_rgba(0,229,255,0.4)] flex-shrink-0">
                <img src="logo.png" alt="Prodi Logo" class="h-14 w-auto object-contain">
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-cyber-neon uppercase">
                    TEO-XR Telecontrol
                </h1>
                <p class="text-cyber-neon text-xs md:text-sm tracking-[0.3em] uppercase opacity-80">
                    XR Controller Motor Command Center
                </p>
            </div>
        </div>

        <div class="mt-4 md:mt-0 flex items-center border border-cyber-alert px-4 py-2 rounded bg-black/50" id="mqtt-status-container">
            <div class="relative flex h-3 w-3 mr-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyber-alert opacity-75" id="mqtt-ping"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-cyber-alert" id="mqtt-dot"></span>
            </div>
            <span id="mqtt-status" class="text-cyber-alert font-mono text-sm tracking-wider font-bold">SYS_OFFLINE</span>
        </div>
    </header>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-6 z-10">
        <div class="cyber-panel p-4 flex flex-col justify-between">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest">LIVE RPM</span>
            <span id="val-rpm" class="data-value text-3xl text-cyber-neon font-bold mt-2">0.00</span>
        </div>
        <div class="cyber-panel p-4 flex flex-col justify-between">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest">ERROR VALLUE</span>
            <span id="val-error" class="data-value text-3xl text-cyber-alert font-bold mt-2">0.00</span>
        </div>
        <div class="cyber-panel p-4 flex flex-col justify-between">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest">RISE TIME</span>
            <span id="val-rt" class="data-value text-2xl text-white font-bold mt-2">--</span>
        </div>
        <div class="cyber-panel p-4 flex flex-col justify-between">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest">SETTLING TIME</span>
            <span id="val-st" class="data-value text-2xl text-white font-bold mt-2">--</span>
        </div>
        <div class="cyber-panel p-4 flex flex-col justify-between col-span-2 md:col-span-1 lg:col-span-1">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest">OVERSHOOT</span>
            <span id="val-os" class="data-value text-2xl text-white font-bold mt-2">--</span>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow z-10">
        
        <div class="cyber-panel col-span-1 lg:col-span-4 p-6 flex flex-col">
            <div class="flex items-center mb-5 border-b border-cyber-neon/30 pb-2">
                <div class="w-2 h-2 bg-cyber-neon rounded-full mr-2 shadow-[0_0_8px_#00e5ff]"></div>
                <h2 class="text-sm font-bold tracking-widest text-cyber-neon uppercase">Control Parameters</h2>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1 uppercase tracking-widest">Mode</label>
                    <select id="mode" class="input-cyber cursor-pointer">
                        <option value="STOP">STOP</option>
                        <option value="MANUAL">MANUAL</option>
                        <option value="PID" selected>PID</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1 uppercase tracking-widest">Vector</label>
                    <select id="direction" class="input-cyber cursor-pointer">
                        <option value="FORWARD">FORWARD</option>
                        <option value="BACKWARD">BACKWARD</option>
                    </select>
                </div>
            </div>

            <div class="bg-black/30 p-4 rounded border border-gray-800 mb-5 relative">
                <div class="absolute top-0 left-2 -mt-2 bg-[#050914] px-1 text-[10px] text-cyber-neon tracking-widest">PID TUNING</div>
                <div class="grid grid-cols-3 gap-3 mt-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">Kp VAL</label>
                        <input type="number" id="kp" value="1.5" step="0.1" class="input-cyber text-center">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">Ki VAL</label>
                        <input type="number" id="ki" value="0.05" step="0.01" class="input-cyber text-center">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">Kd VAL</label>
                        <input type="number" id="kd" value="0.1" step="0.1" class="input-cyber text-center">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1 uppercase tracking-widest">Target RPM</label>
                    <input type="number" id="setpoint" value="120" class="input-cyber text-xl font-bold text-cyber-neon shadow-[inset_0_0_10px_rgba(0,229,255,0.2)]">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1 uppercase tracking-widest">Raw PWM (0-255)</label>
                    <input type="number" id="manual_pwm" value="0" class="input-cyber text-xl font-bold text-gray-300">
                </div>
            </div>

            <div class="mt-auto space-y-3">
                <button onclick="sendConfig()" class="btn-cyber w-full py-3 rounded text-sm font-bold flex justify-center items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    TRANSMIT DATA
                </button>
                <button onclick="startTest()" class="w-full py-3 rounded text-sm font-bold flex justify-center items-center bg-transparent border border-cyber-neon text-cyber-neon hover:bg-cyber-neon hover:text-black transition-all shadow-[0_0_10px_rgba(0,229,255,0.2)]">
                    INIT STEP RESPONSE
                </button>
            </div>
        </div>

        <div class="cyber-panel col-span-1 lg:col-span-8 p-6 flex flex-col">
            <div class="flex items-center justify-between border-b border-cyber-neon/30 pb-2 mb-4">
                <div class="flex items-center">
                    <div class="w-2 h-2 bg-cyber-neon rounded-full mr-2 shadow-[0_0_8px_#00e5ff]"></div>
                    <h2 class="text-sm font-bold tracking-widest text-cyber-neon uppercase">Telemetry Matrix</h2>
                </div>
                <div class="text-[10px] text-gray-500 font-mono">T INTERVAL: 50ms</div>
            </div>
            <div class="flex-grow relative w-full h-[350px] lg:h-auto bg-black/20 rounded-lg p-2 border border-gray-800">
                <canvas id="responseChart"></canvas>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // CHART.JS DENGAN TEMA CYBERPUNK
        // ==========================================
        Chart.defaults.color = '#718096';
        Chart.defaults.font.family = "'Fira Code', monospace";
        
        const ctx = document.getElementById('responseChart').getContext('2d');
        
        // Gradient untuk area di bawah grafik
        let gradientFill = ctx.createLinearGradient(0, 0, 0, 400);
        gradientFill.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
        gradientFill.addColorStop(1, 'rgba(0, 229, 255, 0.0)');

        const responseChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { 
                        label: 'SYS_RPM', 
                        borderColor: '#00e5ff', 
                        backgroundColor: gradientFill, 
                        borderWidth: 2,
                        pointBackgroundColor: '#00e5ff',
                        pointBorderColor: '#fff',
                        pointRadius: 0,
                        data: [], fill: true, tension: 0.2 
                    },
                    { 
                        label: 'TARGET_SP', 
                        borderColor: '#ff2a6d', 
                        borderDash: [4, 4], 
                        borderWidth: 1.5,
                        data: [], fill: false, pointRadius: 0 
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 6, font: { size: 10 } } }
                },
                scales: {
                    x: { 
                        display: true, 
                        grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                        ticks: { display: false } // Sembunyikan label waktu agar clean
                    },
                    y: { 
                        beginAtZero: true, 
                        suggestedMax: 200,
                        grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                        ticks: { font: { size: 10 } }
                    }
                }
            }
        });

        const maxDataPoints = 80;

        let isTesting = false;
        let testStartTime = 0;
        let targetSetpoint = 0;
        let maxRpmReached = 0;
        let riseTimeRecorded = false;
        
        // ==========================================
        // KREDENSIAL CLOUD MQTT BARU
        // ==========================================
        const mqttServer = "3ed3ff9607bb421593226daf3b27b6f4.s1.eu.hivemq.cloud";
        const mqttPort = 8884; 
        const clientId = "XR-HMI-" + Math.random().toString(16).substr(2, 8);
        const mqttUser = "teoxr";
        const mqttPass = "TEOxr073";
        
        const client = new Paho.MQTT.Client(mqttServer, mqttPort, clientId);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        function connectMQTT() {
            document.getElementById("mqtt-status").innerText = "CONNECTING...";
            client.connect({
                userName: mqttUser,
                password: mqttPass,
                useSSL: true,
                onSuccess: onConnect,
                onFailure: (err) => { 
                    console.log("Koneksi gagal:", err.errorMessage);
                    setTimeout(connectMQTT, 5000); 
                }
            });
        }

        function onConnect() {
            const statusContainer = document.getElementById("mqtt-status-container");
            document.getElementById("mqtt-status").innerText = "SYSTEM ONLINE";
            
            // Ubah warna indikator ke Neon Cyan
            statusContainer.classList.replace("border-cyber-alert", "border-cyber-neon");
            document.getElementById("mqtt-status").classList.replace("text-cyber-alert", "text-cyber-neon");
            document.getElementById("mqtt-dot").classList.replace("bg-cyber-alert", "bg-cyber-neon");
            document.getElementById("mqtt-ping").classList.replace("bg-cyber-alert", "bg-cyber-neon");
            
            client.subscribe("robot1/response");
        }

        function onConnectionLost(responseObject) {
            const statusContainer = document.getElementById("mqtt-status-container");
            document.getElementById("mqtt-status").innerText = "SYSTEM ssssssssssOFFLINE";
            
            // Kembalikan ke warna Alert Red
            statusContainer.classList.replace("border-cyber-neon", "border-cyber-alert");
            document.getElementById("mqtt-status").classList.replace("text-cyber-neon", "text-cyber-alert");
            document.getElementById("mqtt-dot").classList.replace("bg-cyber-neon", "bg-cyber-alert");
            document.getElementById("mqtt-ping").classList.replace("bg-cyber-neon", "bg-cyber-alert");
            
            setTimeout(connectMQTT, 3000);
        }

        function onMessageArrived(message) {
            if (message.destinationName === "robot1/response") {
                const data = JSON.parse(message.payloadString);
                const time = new Date().toLocaleTimeString();
                
                document.getElementById('val-rpm').innerText = data.speed.toFixed(2);
                document.getElementById('val-error').innerText = data.error.toFixed(2);

                if (responseChart.data.labels.length > maxDataPoints) {
                    responseChart.data.labels.shift();
                    responseChart.data.datasets[0].data.shift();
                    responseChart.data.datasets[1].data.shift();
                }
                responseChart.data.labels.push(time);
                responseChart.data.datasets[0].data.push(data.speed);
                responseChart.data.datasets[1].data.push(data.setpoint);
                responseChart.update();

                if (isTesting && data.setpoint > 0) {
                    calculateMetrics(data.speed, data.time, data.setpoint);
                }
            }
        }

        function sendCommand(topic, payload) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(payload.toString());
                message.destinationName = topic;
                client.send(message);
            }
        }

        function sendConfig() {
            sendCommand("robot1/mode", document.getElementById("mode").value);
            sendCommand("robot1/direction", document.getElementById("direction").value);
            sendCommand("robot1/pid/kp", document.getElementById("kp").value);
            sendCommand("robot1/pid/ki", document.getElementById("ki").value);
            sendCommand("robot1/pid/kd", document.getElementById("kd").value);
            sendCommand("robot1/setpoint", document.getElementById("setpoint").value);
            sendCommand("robot1/manual_pwm", document.getElementById("manual_pwm").value);
        }

        function startTest() {
            isTesting = true;
            maxRpmReached = 0;
            riseTimeRecorded = false;
            targetSetpoint = parseFloat(document.getElementById("setpoint").value);
            testStartTime = Date.now();
            
            document.getElementById('val-rt').innerText = "CALC...";
            document.getElementById('val-st').innerText = "CALC...";
            document.getElementById('val-os').innerText = "CALC...";

            document.getElementById("mode").value = "PID";
            sendConfig();
        }

        function calculateMetrics(currentRpm, espTime, setpoint) {
            let currentTime = Date.now();
            let elapsedTime = currentTime - testStartTime;

            if (currentRpm > maxRpmReached) {
                maxRpmReached = currentRpm;
                let overshoot = ((maxRpmReached - setpoint) / setpoint) * 100;
                document.getElementById('val-os').innerText = (overshoot > 0 ? overshoot.toFixed(1) : 0) + "%";
            }

            if (!riseTimeRecorded && currentRpm >= (0.9 * setpoint)) {
                document.getElementById('val-rt').innerText = (elapsedTime / 1000).toFixed(2) + "s";
                riseTimeRecorded = true;
            }

            let errorMargin = setpoint * 0.05;
            if (Math.abs(setpoint - currentRpm) <= errorMargin) {
                if (document.getElementById('val-st').innerText === "CALC...") {
                    document.getElementById('val-st').innerText = (elapsedTime / 1000).toFixed(2) + "s";
                }
            } else {
                 document.getElementById('val-st').innerText = "CALC...";
            }
        }

        connectMQTT();
    </script>
</body>
</html>
